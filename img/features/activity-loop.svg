<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190">
  <!-- One touch, everything on: the TV, the receiver and the speaker on one glowing loop,
       after the Activities picture in the Harmony One's own firmware. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc768"/>
      <stop offset=".5" stop-color="#f29a22"/>
      <stop offset="1" stop-color="#d9631a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>

    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d53"/>
      <stop offset=".12" stop-color="#25272b"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15122d"/>
      <stop offset=".35" stop-color="#3a2a5c"/>
      <stop offset=".62" stop-color="#b0435c"/>
      <stop offset=".8" stop-color="#e2702a"/>
      <stop offset=".86" stop-color="#f7b14a"/>
      <stop offset=".861" stop-color="#3b2632"/>
      <stop offset="1" stop-color="#1c1420"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset=".55" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#f08a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55585e"/>
      <stop offset="1" stop-color="#1b1c1f"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset=".5" stop-color="#d3d6db"/>
      <stop offset="1" stop-color="#a9aeb6"/>
    </linearGradient>
    <linearGradient id="silverSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a8b0"/>
      <stop offset="1" stop-color="#6f747c"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b2a"/>
      <stop offset="1" stop-color="#132b40"/>
    </linearGradient>
    <radialGradient id="knob" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c9cdd3"/>
      <stop offset="1" stop-color="#7d828a"/>
    </radialGradient>

    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4046"/>
      <stop offset=".5" stop-color="#2c2e33"/>
      <stop offset="1" stop-color="#202226"/>
    </linearGradient>
    <radialGradient id="cone" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#5a5e66"/>
      <stop offset=".6" stop-color="#25272b"/>
      <stop offset="1" stop-color="#101113"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#868b93"/>
    </linearGradient>
  </defs>

  <!-- the loop, behind everything -->
  <ellipse cx="150" cy="106" rx="106" ry="62" fill="none" stroke="#f6a02a" stroke-width="12" opacity=".45" filter="url(#glow)"/>
  <ellipse cx="150" cy="106" rx="106" ry="62" fill="none" stroke="#9a4b0a" stroke-width="9"/>
  <ellipse cx="150" cy="106" rx="106" ry="62" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <ellipse cx="150" cy="104.6" rx="106" ry="61" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>

  <!-- floor shadows -->
  <ellipse cx="150" cy="106" rx="40" ry="3.5" fill="#000" opacity=".35" filter="url(#soft)"/>
  <ellipse cx="80" cy="166" rx="62" ry="4" fill="#000" opacity=".4" filter="url(#soft)"/>
  <ellipse cx="232" cy="181" rx="30" ry="3.5" fill="#000" opacity=".4" filter="url(#soft)"/>

  <!-- TV -->
  <g>
    <path d="M141 90h18l3 10h-24z" fill="url(#foot)"/>
    <rect x="114" y="99" width="72" height="6" rx="2" fill="url(#foot)"/>
    <rect x="114.5" y="99.5" width="71" height="1" rx=".5" fill="#fff" opacity=".25"/>
    <rect x="84" y="6" width="132" height="86" rx="3" fill="url(#bezel)" stroke="#050506"/>
    <rect x="84.5" y="6.5" width="131" height="1" fill="#fff" opacity=".3"/>
    <rect x="91" y="12" width="118" height="70" fill="url(#sky)"/>
    <circle cx="176" cy="69" r="16" fill="url(#sun)"/>
    <rect x="91" y="72.3" width="118" height="9.7" fill="#2a1d27"/>
    <rect x="91" y="72" width="118" height="1" fill="#f7b14a" opacity=".85"/>
    <path d="M91 12h118v26c-40 6-80 0-118 14z" fill="url(#glare)"/>
    <rect x="91" y="12" width="118" height="70" fill="none" stroke="#000" stroke-opacity=".6"/>
    <rect x="148" y="85.5" width="4" height="1.6" rx=".8" fill="#6fd0ff"/>
  </g>

  <!-- AV receiver -->
  <g>
    <path d="M26 117h111l-5 6H21z" fill="#e2e5e9"/>
    <path d="M132 123l5-6v37l-5 6z" fill="url(#silverSide)"/>
    <rect x="21" y="123" width="111" height="37" rx="1.5" fill="url(#silver)" stroke="#5f646c"/>
    <rect x="21.5" y="123.5" width="110" height="1" fill="#fff"/>
    <rect x="28" y="160" width="10" height="3" fill="#24262a"/>
    <rect x="115" y="160" width="10" height="3" fill="#24262a"/>
    <rect x="30" y="129" width="56" height="13" rx="1" fill="url(#lcd)" stroke="#4d525a"/>
    <rect x="34" y="132.5" width="22" height="2.4" fill="#68d6ff"/>
    <rect x="58" y="132.5" width="9" height="2.4" fill="#68d6ff" opacity=".7"/>
    <rect x="34" y="136.8" width="14" height="1.8" fill="#68d6ff" opacity=".55"/>
    <rect x="76" y="132" width="6" height="7" fill="#68d6ff" opacity=".35"/>
    <g fill="#9ca1a9">
      <rect x="30" y="148" width="7" height="3.4" rx=".8"/>
      <rect x="40" y="148" width="7" height="3.4" rx=".8"/>
      <rect x="50" y="148" width="7" height="3.4" rx=".8"/>
      <rect x="60" y="148" width="7" height="3.4" rx=".8"/>
    </g>
    <circle cx="80" cy="150" r="2.4" fill="#3e4247"/>
    <circle cx="111" cy="141.5" r="13.5" fill="#8a8f97"/>
    <circle cx="111" cy="141.5" r="12" fill="url(#knob)" stroke="#6b7078" stroke-width=".8"/>
    <circle cx="111" cy="141.5" r="8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>
    <rect x="110.2" y="131.5" width="1.6" height="4" rx=".8" fill="#4a4e55"/>
    <circle cx="28" cy="155.5" r="1.3" fill="#56e07a"/>
  </g>

  <!-- speaker -->
  <g>
    <path d="M250 98l6-5v83l-6 5z" fill="#141518"/>
    <path d="M212 98l5-5h39l-6 5z" fill="#4c4f56"/>
    <rect x="212" y="98" width="38" height="83" rx="1.5" fill="url(#cab)" stroke="#0b0c0d"/>
    <rect x="212.5" y="98.5" width="37" height="1" fill="#fff" opacity=".2"/>
    <circle cx="231" cy="110" r="6.5" fill="url(#rim)"/>
    <circle cx="231" cy="110" r="4.6" fill="url(#cone)"/>
    <circle cx="229.8" cy="108.8" r="1.4" fill="#fff" opacity=".5"/>
    <circle cx="231" cy="135" r="14" fill="url(#rim)"/>
    <circle cx="231" cy="135" r="11.8" fill="url(#cone)"/>
    <circle cx="231" cy="135" r="4.2" fill="#2e3035" stroke="#5c6068" stroke-width=".6"/>
    <circle cx="231" cy="163" r="14" fill="url(#rim)"/>
    <circle cx="231" cy="163" r="11.8" fill="url(#cone)"/>
    <circle cx="231" cy="163" r="4.2" fill="#2e3035" stroke="#5c6068" stroke-width=".6"/>
  </g>
</svg>
